name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk golden-gods.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-gods-apk
          path: golden-gods.apk
          if-no-files-found: error

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (latest)
          body: |
            APK de depuración generado automáticamente para el commit ${{ github.sha }}.

            Instalación en el móvil: descarga el APK y ábrelo (tendrás que permitir
            "instalar apps de fuentes desconocidas" para tu navegador o gestor de archivos).
          prerelease: true
          make_latest: false
          files: golden-gods.apk
